<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cosme ♥ ログイン</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fdf2f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(233, 30, 99, 0.1);
            width: 350px;
            text-align: center;
        }
        h2 {
            color: #e91e63;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #777;
            font-size: 13px;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #ffd1dc;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #e91e63;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #e91e63;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background: #d81b60;
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>My Cosme ♥</h2>
        <p>メールアドレスでログインして、データを同期しよう</p>
        
        <input type="email" id="email" placeholder="メールアドレス" value="codeblue04090611@gmail.com">
        <input type="password" id="password" placeholder="パスワード">
        
        <button id="loginButton" onclick="handleLogin()">ログイン / 新規登録</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Firebaseの設定 (自動でプロジェクトを認識するためこのままでOK)
        const firebaseConfig = {
            authDomain: "mycosme.firebaseapp.com",
            projectId: "mycosme"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.handleLogin = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const button = document.getElementById('loginButton');

            if (!email || !password) {
                alert('メールアドレスとパスワードを入力してください。');
                return;
            }

            button.innerText = '処理中...';
            button.disabled = true;

            try {
                // まずログインを試す
                await signInWithEmailAndPassword(auth, email, password);
                alert('ログインしました！');
                // window.location.href = 'main.html'; // ログイン後の画面があればここを有効に
            } catch (error) {
                // アカウントがない、またはパスワードエラーの場合のフォールバックとして新規作成を試す
                try {
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert('アカウントを作成し、ログインしました！');
                } catch (createError) {
                    alert('ログインに失敗しました。パスワードを確認してください。');
                }
            } finally {
                button.innerText = 'ログイン / 新規登録';
                button.disabled = false;
            }
        };
    </script>
</body>
</html>
