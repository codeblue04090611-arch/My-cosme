<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cosme - ログイン</title>
    <!-- Firebase SDK を読み込む (必須) -->
    <script type="module">
        // Firebase の設定情報 (自分のプロジェクトのものに書き換えてね)
        // ここは例なので、コンソールから取得した実際のFirebase設定を貼り付けるのが確実
        // いま動いている firebase.json の設定が生きている前提で進めます
    </script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h2 { color: #e91e63; margin-bottom: 30px; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #e91e63; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; }
        button:hover { background: #d81b60; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>My Cosme ♥</h2>
        <p>メールアドレスでログインして、スマホとPCでデータを同期しよう</p>
        
        <!-- ログイン入力フォーム (修正済み) -->
        <input type="email" id="email" placeholder="メールアドレス" value="codeblue04090611@gmail.com">
        <input type="password" id="password" placeholder="パスワード">
        
        <!-- ログインボタン (エラーが出ないように id と onclick を修正) -->
        <button id="loginButton" onclick="handleManualLogin()">ログイン / 新規登録</button>
    </div>

    <!-- JavaScript の処理 (ここを追記してエラーを解消する) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // --- ここから Firebase 設定 ---
        // (念のため、以前のコードに書かれていた設定をここに貼り付けるとより確実です)
        const firebaseConfig = {
            // [ここにあなたのFirebaseプロジェクトの設定オブジェクトが入ります]
            // 例: apiKey: "...", authDomain: "...", ...
            // ※今回は、ブラウザが自動でプロジェクトIDを認識する前提で設定を省略して進めることも可能です
        };
        // --- ここまで Firebase 設定 ---

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // エラーが出ないように定義した新しいログイン関数
        window.handleManualLogin = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const button = document.getElementById('loginButton');

            if (!email || !password) {
                alert('メールアドレスとパスワードを入力してください。');
                return;
            }

            button.innerText = '処理中...';
            button.disabled = true;

            try {
                // まずログインを試みる
                await signInWithEmailAndPassword(auth, email, password);
                alert('ログインしました！');
                // ログイン成功後にページを遷移させる（例: top.html など）
                // window.location.href = 'top.html'; 
            } catch (error) {
                // ログイン失敗（アカウントがない）場合は新規登録を試みる
                if (error.code === 'auth/user-not-found') {
                    try {
                        await createUserWithEmailAndPassword(auth, email, password);
                        alert('アカウントを作成し、ログインしました！');
                        // window.location.href = 'top.html';
                    } catch (createError) {
                        alert('新規登録に失敗しました: ' + createError.message);
                    }
                } else {
                    alert('ログインに失敗しました: ' + error.message);
                }
            } finally {
                button.innerText = 'ログイン / 新規登録';
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
