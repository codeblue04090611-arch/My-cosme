<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My cosme ♥</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 400px;
            box-sizing: border-box;
            text-align: center;
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #e91e63;
            margin-bottom: 8px;
            font-style: italic;
        }
        .subtext {
            font-size: 13px;
            color: #888888;
            margin-bottom: 35px;
        }
        .input-field {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            border-color: #e91e63;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .action-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-login {
            background: linear-gradient(135deg, #f06292, #e91e63);
            color: white;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
        }
        .btn-register {
            background: #fce4ec;
            color: #c2185b;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
        /* ログイン成功後に切り替わるアプリ画面 */
        #app-screen {
            display: none;
            width: 100%;
            height: 100vh;
            background: #ffffff;
            padding: 30px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- ログイン画面（お気に入りの見た目を完全再現） -->
    <div id="login-screen" class="login-box">
        <div class="logo">My cosme ♥</div>
        <div class="subtext">メールアドレスでログインして、スマホとPCでデータを同期しよう</div>
        
        <input type="email" id="email" class="input-field" placeholder="メールアドレス" value="codeblue04090611@gmail.com">
        <input type="password" id="password" class="input-field" placeholder="パスワード（6文字以上）">
        
        <div class="btn-container">
            <button class="action-btn btn-login" onclick="handleLogin()">ログイン</button>
            <button class="action-btn btn-register" onclick="handleRegister()">新規登録</button>
        </div>
    </div>

    <!-- ログイン後のマイコスメ アプリ画面 -->
    <div id="app-screen">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #fdf2f4; padding-bottom: 15px;">
            <h1 style="color: #e91e63; margin: 0; font-size: 24px;">My cosme ♥ マイページ</h1>
            <button onclick="handleLogout()" style="background: #f0f2f5; color: #555; padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold;">ログアウト</button>
        </div>
        <div style="margin-top: 40px; text-align: center;">
            <h2 style="color: #333; font-size: 20px;">ログイン成功しました✨</h2>
            <p style="color: #666;">ここにあなたのコスメ管理アプリの画面が広がります！</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            authDomain: "mycosme.firebaseapp.com",
            projectId: "mycosme"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app-screen');

        // ログイン状態を監視して、ログインしていれば自動でアプリ画面を表示
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.style.display = 'none';
                appScreen.style.display = 'block';
            } else {
                loginScreen.style.display = 'block';
                appScreen.style.display = 'none';
            }
        });

        // ログインボタンの処理
        window.handleLogin = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('メールアドレスとパスワードを入力してください。');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert('ログインに失敗しました: ' + error.message);
            }
        };

        // 新規登録ボタンの処理
        window.handleRegister = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('メールアドレスとパスワードを入力してください。');
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert('新規登録に失敗しました: ' + error.message);
            }
        };

        // ログアウト処理
        window.handleLogout = async function() {
            await signOut(auth);
        };
    </script>
</body>
</html>
